# COROC en un solo PC con Windows (Docker Desktop): PostgreSQL 16, Redis 7, migraciones y la API, solo para este equipo.
# Lo usan los scripts de esta carpeta; no hace falta ejecutarlo a mano. Guía: docs/GUIA_PC_WINDOWS.md.
# La imagen «coroc-api:pc» viene ya construida en el paquete (coroc-api.tar) y los secretos en .env, que crea
# instalar.ps1 con valores aleatorios. La API solo escucha en 127.0.0.1: otros equipos de la red no la ven.
name: coroc

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta .env}
      POSTGRES_DB: coroc
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, retries: 30 }
    volumes: [db:/var/lib/postgresql/data]

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]

  migrate:
    image: coroc-api:pc
    command: sh -c "node dist/db/migrate.js && node dist/db/setup-roles.js"
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/coroc
      COROC_API_DB_PASSWORD: ${COROC_API_DB_PASSWORD:?falta .env}
    depends_on: { db: { condition: service_healthy } }

  api:
    image: coroc-api:pc
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://coroc_api:${COROC_API_DB_PASSWORD}@db:5432/coroc
      REDIS_URL: redis://redis:6379
      COROC_STORAGE_DIR: /var/lib/coroc/objects
    volumes: [objects:/var/lib/coroc/objects]
    ports: ["127.0.0.1:${COROC_API_PORT:-3000}:3000"]
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 15s, retries: 5 }
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started } }

volumes:
  db: {}
  objects: {}
  redis: {}
