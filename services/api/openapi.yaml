        lateFee: { $ref: '#/components/schemas/LateFeePolicy' }
        totalPayable: { $ref: '#/components/schemas/Minor' }
        totalInterest: { $ref: '#/components/schemas/Minor' }
        effectiveAnnualRate: { type: number }
        status: { type: string, enum: [active, closed, written_off] }
        summary: { $ref: '#/components/schemas/LoanSummary' }
        realizedProfit: { $ref: '#/components/schemas/Minor' }
        expectedMethod: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        version: { type: integer }
    AllocationLine:
      type: object
      properties:
        number: { type: integer }
        toLateFee: { $ref: '#/components/schemas/Minor' }
        toInstallment: { $ref: '#/components/schemas/Minor' }
        completed: { type: boolean }
        partial: { type: boolean }
    LedgerEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [disbursement, payment, late_fee, waiver, reversal, adjustment, credit_balance] }
        entryDate: { type: string, format: date }
        recordedAt: { type: string, format: date-time }
        amount: { $ref: '#/components/schemas/Minor' }
        method: { type: string }
        reference: { type: string }
        institution: { type: string }
        source: { type: string }
        documentId: { type: [string, 'null'], format: uuid }
        reversesId: { type: [string, 'null'], format: uuid }
        reversedBy: { type: [string, 'null'], format: uuid }
        reason: { type: string }
        note: { type: string }
        auto: { type: boolean }
        allocation:
          type: array
          items: { $ref: '#/components/schemas/AllocationLine' }
        receiptNumber: { type: [string, 'null'] }
        createdBy: { type: string }
    PaymentInput:
      type: object
      required: [amount, date]
      properties:
        amount: { $ref: '#/components/schemas/Minor' }
        date: { type: string, format: date }
        method: { type: string, maxLength: 60 }
        reference: { type: string, maxLength: 80 }
        institution: { type: string, maxLength: 80 }
        note: { type: string, maxLength: 500 }
        cash: { type: boolean, default: false }
        proofDocumentId: { type: string, format: uuid }
    ReceiptData:
      type: object
      description: Contenido del recibo «Gracias por tu pago» (§15), en el idioma del deudor
      properties:
        lang: { $ref: '#/components/schemas/Lang' }
        number: { type: string }
        issuedAt: { type: string, description: Fecha y hora local YYYY-MM-DD HH:mm }
        company:
          type: object
          properties:
            name: { type: string }
            taxId: { type: string }
            phone: { type: string }
            email: { type: string }
            address: { type: string }
        client:
          type: object
          properties:
            fullName: { type: string }
            code: { type: string }
        contract: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        payment:
          type: object
          properties:
            date: { type: string, format: date }
            amount: { $ref: '#/components/schemas/Minor' }
            method: { type: string }
            reference: { type: string }
        totalInstallments: { type: integer }
        coverage: { type: string, example: 'Cuotas 2 y 3 (completas) · Cuota 4 (abono parcial $ 30.000)' }
        remainingInstallments: { type: integer }
        accumulatedPaid: { $ref: '#/components/schemas/Minor' }
        previousBalance: { $ref: '#/components/schemas/Minor' }
        newBalance: { $ref: '#/components/schemas/Minor' }
        next:
          type: object
          properties:
            number: { type: integer }
            dueDate: { type: string, format: date }
            amount: { $ref: '#/components/schemas/Minor' }
        verificationCode: { type: string }
        verificationUrl: { type: string }
        voided: { type: boolean }
    PaymentResult:
      type: object
      required: [entry, receipt, surplus, loanClosed]
      properties:
        entry: { $ref: '#/components/schemas/LedgerEntry' }
        receipt: { $ref: '#/components/schemas/ReceiptData' }
        receiptDocument: { $ref: '#/components/schemas/Document' }
        surplus: { $ref: '#/components/schemas/Minor' }
        message: { $ref: '#/components/schemas/Message' }
        loanClosed: { type: boolean }
    ReversalResult:
      type: object
      required: [entry, balance]
      properties:
        entry: { $ref: '#/components/schemas/LedgerEntry' }
        voidedReceipt: { type: [string, 'null'] }
        balance: { $ref: '#/components/schemas/Minor' }
    ReceiptRecord:
      type: object
      required: [number, entryId, voided, createdAt, data, documentId, voidDocumentId]
      properties:
        number: { type: string }
        entryId: { type: string, format: uuid }
        voided: { type: boolean }
        createdAt: { type: string, format: date-time }
        data: { $ref: '#/components/schemas/ReceiptData' }
        documentId: { type: [string, 'null'], format: uuid, description: PDF del recibo (nulo mientras se genera) }
        voidDocumentId: { type: [string, 'null'], format: uuid, description: Versión sellada ANULADO }
    Document:
      type: object
      required: [id, clientId, loanId, contract, kind, name, fileName, folderPath, mime, size, sha256, version, superseded, source, tags, lang, meta, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        clientId: { type: [string, 'null'], format: uuid }
        loanId: { type: [string, 'null'], format: uuid }
        contract: { type: [string, 'null'] }
        kind: { $ref: '#/components/schemas/DocKind' }
        name: { type: string, description: 'Nombre visible, con tildes' }
        fileName: { type: string, example: 2026-10-09_1435_RECIBO_RC-000482_CT-000125.pdf }
        folderPath: { type: string, example: 'Maria Jose Perez Gomez - C000042/CT-000125/03 Recibos emitidos' }
        mime: { type: string }
        size: { type: integer }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        version: { type: integer, minimum: 1 }
        superseded: { type: boolean }
        source: { type: string }
        tags: { type: array, items: { type: string } }
        lang: { oneOf: [{ $ref: '#/components/schemas/Lang' }, { type: 'null' }] }
        meta: { type: object }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FileLink:
      type: object
      required: [url, path, expiresAt]
      properties:
        url: { type: string, format: uri }
        path: { type: string, description: Ruta relativa a la base de la API (`/v1`) }
        expiresAt: { type: string, format: date-time }
    Task:
      type: object
      required: [id, kind, status, progress, documentId, error, createdAt, finishedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [schedule, receipt, receipt_void, statement, payoff, report, backup] }
        status: { type: string, enum: [pending, running, done, failed, cancelled] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        documentId: { type: [string, 'null'], format: uuid }
        error: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    FolderManifest:
      type: object
      required: [lang, full, generatedAt, nextSince, rootFolders, subfolders, clients, files, removed, nextPage]
      properties:
        lang: { $ref: '#/components/schemas/Lang' }
        full: { type: boolean }
        generatedAt: { type: string, format: date-time }
        nextSince: { type: string, format: date-time, description: Valor de `since` para la próxima sincronización }
        rootFolders: { type: array, items: { type: string }, example: [_Sin asignar, _Entrada, _Informes, _Respaldos] }
        subfolders: { type: array, minItems: 5, maxItems: 5, items: { type: string } }
        clients:
          type: array
          items:
            type: object
            required: [id, code, folderName, marker, contracts]
            properties:
              id: { type: string, format: uuid }
              code: { type: string }
              folderName: { type: string }
              marker: { type: string, description: 'Ruta del archivo `.coroc-id`' }
              contracts: { type: array, items: { type: string } }
        files:
          type: array
          items:
            type: object
            required: [documentId, clientId, path, size, sha256, updatedAt]
            properties:
              documentId: { type: string, format: uuid }
              clientId: { type: [string, 'null'], format: uuid }
              path: { type: string }
              size: { type: integer }
              sha256: { type: string }
              updatedAt: { type: string, format: date-time }
        removed: { type: array, items: { type: string, format: uuid } }
        nextPage: { type: [string, 'null'] }
    ReportRequest:
      type: object
      required: [type, format]
      additionalProperties: false
      properties:
        type: { type: string, enum: [portfolio, portfolio_by_collector, collections, aging, closed, cashflow, ledger, messages] }
        format: { type: string, enum: [pdf, xlsx, csv] }
        lang: { $ref: '#/components/schemas/Lang' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        collectorId: { type: string, format: uuid }
        currency: { $ref: '#/components/schemas/Currency' }
    ReceiptVerification:
      type: object
      required: [valid, voided]
      properties:
        valid: { type: boolean }
        voided: { type: boolean }
        company: { type: string }
        number: { type: string }
        paymentDate: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Minor' }
        currency: { $ref: '#/components/schemas/Currency' }
        issuedAt: { type: string }
    Region:
      type: [object, 'null']
      description: Dónde se leyó el campo, en fracciones de la página (0–1), para resaltarlo sobre la imagen (§13.6)
      properties:
        page: { type: integer, minimum: 0 }
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }
    ExtractedString:
      type: object
      properties:
        value: { type: [string, 'null'] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        region: { $ref: '#/components/schemas/Region' }
    ExtractedAmount:
      type: object
      properties:
        value: { type: [integer, 'null'], format: int64 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        region: { $ref: '#/components/schemas/Region' }
    Extraction:
      type: object
      description: Campos leídos del comprobante con su confianza (§13.3)
      properties:
        receiverName: { $ref: '#/components/schemas/ExtractedString' }
        payerName: { $ref: '#/components/schemas/ExtractedString' }
        amount: { $ref: '#/components/schemas/ExtractedAmount' }
        currency: { $ref: '#/components/schemas/ExtractedString' }
        date: { $ref: '#/components/schemas/ExtractedString' }
        time: { $ref: '#/components/schemas/ExtractedString' }
        entity: { $ref: '#/components/schemas/ExtractedString' }
        reference: { $ref: '#/components/schemas/ExtractedString' }
        destinationLast4: { $ref: '#/components/schemas/ExtractedString' }
        documentType: { $ref: '#/components/schemas/ExtractedString' }
        tamperSignals: { type: array, items: { type: string } }
    Flag:
      type: object
      properties:
        code:
          type: string
          enum: [MISSING_FIELD, LOW_CONFIDENCE, RECEIVER_MISMATCH, PAYER_MISMATCH, PAYER_INFERRED, FUTURE_DATE, BEFORE_DISBURSEMENT, TOO_OLD, NON_POSITIVE_AMOUNT, CURRENCY_MISMATCH, TAMPER_SIGNAL, NOT_A_RECEIPT, OCR_UNAVAILABLE, EXTRACTION_MISMATCH, SENDER_UNKNOWN, SENDER_AMBIGUOUS, LOAN_AMBIGUOUS]
        field: { type: string }
        detail: { type: string }
        severity: { type: string, enum: [blocking, warning] }
    IntakeEvent:
      type: object
      required: [id, channel, documentId, status, stage, extraction, identification, flags, createdAt]
      properties:
        id: { type: string, format: uuid }
        channel: { type: string, enum: [whatsapp, email, upload_link, share, folder, upload] }
        senderPhone: { type: [string, 'null'] }
        senderEmail: { type: [string, 'null'] }
        messageText: { type: [string, 'null'], description: Texto que acompañó al archivo }
        documentId: { type: string, format: uuid }
        fileName: { type: [string, 'null'] }
        mime: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/IntakeStatus' }
        stage: { type: string, enum: [RECIBIDO, ALMACENADO, CLASIFICADO, LEÍDO, EXTRAÍDO, VALIDADO, EN_REVISIÓN, APLICADO_AUTOMÁTICO, RECIBO_EMITIDO, RECIBO_ENVIADO, DUPLICADO, NO_ES_COMPROBANTE, RECHAZADO] }
        engine: { type: [string, 'null'], description: 'Motor de extracción: `rules` o el modelo de IA (ADR-017)' }
        extraction: { $ref: '#/components/schemas/Extraction' }
        identification:
          type: object
          properties:
            status: { type: string, enum: [identified, ambiguous, unknown] }
            clientId: { type: [string, 'null'], format: uuid }
            via: { type: [string, 'null'], enum: [upload_link, folder, phone, email, codebtor_phone, null] }
            loanRule: { type: [string, 'null'], enum: [single, amount_match, oldest_overdue, ambiguous, null] }
            duplicateOf: { type: [string, 'null'], format: uuid }
            candidates:
              type: array
              items:
                type: object
                properties:
                  clientId: { type: string, format: uuid }
                  score: { type: number }
                  reasons: { type: array, items: { type: string } }
                  name: { type: [string, 'null'] }
                  code: { type: [string, 'null'] }
        flags:
          type: array
          items: { $ref: '#/components/schemas/Flag' }
        receiverMatch:
          type: [object, 'null']
          properties:
            holderName: { type: string }
            score: { type: number }
        clientId: { type: [string, 'null'], format: uuid }
        clientName: { type: [string, 'null'] }
        clientCode: { type: [string, 'null'] }
        loanId: { type: [string, 'null'], format: uuid }
        contract: { type: [string, 'null'] }
        currency: { type: [string, 'null'] }
        entryId: { type: [string, 'null'], format: uuid }
        receiptNumber: { type: [string, 'null'] }
        receiptDocumentId: { type: [string, 'null'], format: uuid }
        revertibleUntil: { type: [string, 'null'], format: date-time }
        reason: { type: [string, 'null'] }
        decidedBy: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IntakeSummary:
      type: object
      required: [review, unassigned, processing, revertible, pending]
      properties:
        review: { type: integer }
        unassigned: { type: integer }
        processing: { type: integer }
        revertible: { type: integer, description: Registrados automáticamente que aún se pueden revertir con un toque }
        pending: { type: integer, description: review + unassigned (contador de la navegación) }
    UploadLink:
      type: object
      required: [url, expiresAt, createdAt, uses]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        uses: { type: integer }
        lastUsedAt: { type: [string, 'null'], format: date-time }
    PortalView:
      type: object
      required: [company, clientFirstName, lang, contract, currency, summary, closed, installments]
      properties:
        company:
          type: object
          properties:
            name: { type: string }
            phone: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
        clientFirstName: { type: string }
        lang: { $ref: '#/components/schemas/Lang' }
        contract: { type: string }
        currency: { type: string }
        summary: { type: object }
        closed: { type: boolean }
        installments:
          type: array
          items:
            type: object
            properties:
              number: { type: integer }
              dueDate: { type: string, format: date }
              amount: { $ref: '#/components/schemas/Minor' }
              paid: { $ref: '#/components/schemas/Minor' }
              status: { type: string, enum: [paid, partial, overdue, pending] }
    WhatsAppAccount:
      type: object
      required: [configured, active, webhookUrl, serverReady]
      properties:
        configured: { type: boolean }
        phoneNumberId: { type: [string, 'null'] }
        displayNumber: { type: [string, 'null'] }
        active: { type: boolean }
        updatedAt: { type: [string, 'null'], format: date-time }
        webhookUrl: { type: string, format: uri }
        serverReady: { type: boolean, description: El servidor tiene el secreto de la app y el token de verificación de Meta }
    ContactDecision:
      type: object
      properties:
        decision: { type: string, enum: [send, reschedule, block] }
        at: { type: string, format: date-time }
        ruleSet: { type: string, example: CO_LEY_2300_2023 }
        reasons:
          type: array
          items:
            type: object
            properties:
              code: { type: string, enum: [OUT_OF_WINDOW, HOLIDAY_SKIPPED, MAX_PER_DAY, CHANNEL_WEEK, TRANSACTIONAL_IMMEDIATE, DEBTOR_EXCEPTION] }
              detail: { type: string }
    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        clientId: { type: string, format: uuid }
        loanId: { type: string, format: uuid }
        event: { $ref: '#/components/schemas/MessageEvent' }
        kind: { type: string, enum: [collection, transactional] }
        channel: { $ref: '#/components/schemas/Channel' }
        lang: { $ref: '#/components/schemas/Lang' }
        body: { type: string }
        attachmentDocumentId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/MessageStatus' }
        decision: { $ref: '#/components/schemas/ContactDecision' }
        scheduledAt: { type: [string, 'null'], format: date-time }
        sentAt: { type: [string, 'null'], format: date-time }
        assisted:
          type: object
          description: En modo asistido, enlaces listos para que el usuario envíe
          properties:
            whatsappUrl: { type: string, format: uri }
            mailtoUrl: { type: string }
