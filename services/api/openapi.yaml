        id: { type: string, format: uuid, readOnly: true }
        country: { type: string, enum: [CO, BR, US] }
        effectiveAnnual: { type: number, exclusiveMinimum: 0 }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date }
        source: { type: string, description: 'Resolución o fuente oficial' }
    Dashboard:
      type: object
      description: 'Indicadores de una sola moneda (§17): nunca se suman monedas distintas'
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        currencies: { type: array, items: { $ref: '#/components/schemas/Currency' } }
        asOf: { type: string, format: date }
        refreshing: { type: boolean, description: 'El estado diario de los préstamos se está poniendo al día en segundo plano' }
        clientsActive: { type: integer }
        clientsTotal: { type: integer }
        totalLent: { $ref: '#/components/schemas/Minor' }
        totalLentHistoric: { $ref: '#/components/schemas/Minor' }
        expectedToday: { $ref: '#/components/schemas/Minor' }
        collectedToday: { $ref: '#/components/schemas/Minor' }
        overdueTotal: { $ref: '#/components/schemas/Minor' }
        totalReceivable: { $ref: '#/components/schemas/Minor' }
        lateFeesOutstanding: { $ref: '#/components/schemas/Minor' }
        trend:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              amount: { $ref: '#/components/schemas/Minor' }
        aging:
          type: object
          properties:
            current: { $ref: '#/components/schemas/AgingBucket' }
            d1_7: { $ref: '#/components/schemas/AgingBucket' }
            d8_30: { $ref: '#/components/schemas/AgingBucket' }
            d30p: { $ref: '#/components/schemas/AgingBucket' }
    AgingBucket:
      type: object
      properties:
        loans: { type: integer }
        amount: { $ref: '#/components/schemas/Minor' }
    TodayCollections:
      type: object
      properties:
        asOf: { type: string, format: date }
        items:
          type: array
          items:
            type: object
            properties:
              loanId: { type: string, format: uuid }
              clientId: { type: string, format: uuid }
              clientCode: { type: string }
              clientName: { type: string }
              phone: { type: string }
              contract: { type: string }
              currency: { $ref: '#/components/schemas/Currency' }
              installmentNumber: { type: [integer, 'null'] }
              dueDate: { type: [string, 'null'], format: date }
              dueToday: { $ref: '#/components/schemas/Minor' }
              overdue: { $ref: '#/components/schemas/Minor' }
              amountToCollect: { $ref: '#/components/schemas/Minor' }
              daysPastDue: { type: integer }
              status: { type: string, enum: [due_today, overdue] }
              balance: { $ref: '#/components/schemas/Minor' }
    Backup:
      type: object
      required: [id, status, progress, fileName, size, sha256, counts, createdAt, finishedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, running, done, failed, cancelled] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        fileName: { type: [string, 'null'], example: COROC_Respaldo_Empresa_2026-10-09_1435.coroc }
        size: { type: [integer, 'null'] }
        sha256: { type: [string, 'null'] }
        counts: { type: object, additionalProperties: { type: integer } }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    Restore:
      type: object
      required: [id, status, size, summary, createdAt, appliedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [uploading, uploaded, verified, applied, failed] }
        size: { type: [integer, 'null'] }
        summary:
          oneOf:
            - type: 'null'
            - type: object
              required: [company, createdAt, format, schema, counts, documents, bytes]
              properties:
                company: { type: string }
                createdAt: { type: string }
                format: { type: string }
                schema: { type: string }
                counts: { type: object, additionalProperties: { type: integer } }
                documents: { type: integer }
                bytes: { type: integer }
        createdAt: { type: string, format: date-time }
        appliedAt: { type: [string, 'null'], format: date-time }
