# Entorno local completo: PostgreSQL 16, Redis 7 y la API.
#   docker compose -f services/api/docker-compose.yml up --build
# Después, cree la primera empresa (pide la contraseña del Propietario):
#   docker compose -f services/api/docker-compose.yml run --rm api node dist/cli/tenant-create.js --slug mi-empresa --name "Mi Empresa" --owner admin --owner-name "Nombre"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coroc
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, retries: 20 }
    volumes: [db:/var/lib/postgresql/data]
  redis:
    image: redis:7
  migrate:
    build: { context: ../.., dockerfile: services/api/Dockerfile }
    command: sh -c "node dist/db/migrate.js && node dist/db/setup-roles.js"
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@db:5432/coroc
      COROC_API_DB_PASSWORD: coroc-api-local
    depends_on: { db: { condition: service_healthy } }
  api:
    build: { context: ../.., dockerfile: services/api/Dockerfile }
    env_file: .env.local
    environment:
      DATABASE_URL: postgres://coroc_api:coroc-api-local@db:5432/coroc
      DATABASE_ADMIN_URL: postgres://postgres:postgres@db:5432/coroc
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started } }
volumes:
  db: {}
