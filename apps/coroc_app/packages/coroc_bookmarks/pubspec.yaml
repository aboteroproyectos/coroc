name: coroc_bookmarks
description: "COROC · carpeta COROC en macOS con marcador de seguridad (security-scoped bookmark, §16.2)."
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: CorocBookmarksPlugin
