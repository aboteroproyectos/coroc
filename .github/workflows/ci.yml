name: CI

on:
  push:
    branches: [main, 'fase-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Núcleo financiero y API (Node.js 22, PostgreSQL 16) ───
  api:
    name: Núcleo y API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # En CI la lectura con OCR es obligatoria: sin Tesseract, las pruebas de CA-07 a CA-09 y CA-19 fallan en vez de omitirse.
      COROC_REQUIRE_OCR: '1'
      # Umbrales de cobertura: núcleo ≥ 90 %, API ≥ 80 % de líneas (vitest.config.ts de cada paquete).
      COVERAGE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium para los PDF (Playwright)
        run: npx playwright-core install --with-deps chromium-headless-shell
      - name: Tesseract y Poppler para la lectura de comprobantes (Fase 3)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-spa tesseract-ocr-por tesseract-ocr-eng poppler-utils
      - name: Compilar
        run: npm run build
      - name: Tipos (incluye pruebas)
        run: npm run typecheck -w @coroc/api && npm run typecheck -w @coroc/core
      - name: Textos de error en los tres idiomas
        run: npm run lint:i18n
      - name: Contrato OpenAPI
        run: npx --yes @redocly/cli@1 lint services/api/openapi.yaml --format=github-actions
      - name: Almacén compatible con S3 (MinIO) para probar el modo de producción con Cloudflare R2 (ADR-060)
        run: |
          # quay.io a veces niega la descarga sin sesión; Docker Hub publica la misma imagen.
          for image in quay.io/minio/minio docker.io/minio/minio; do docker pull -q "$image" && break; done
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=coroc-ci -e MINIO_ROOT_PASSWORD=coroc-ci-minio "$image" server /data
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/minio/health/live && exit 0; sleep 1; done
          docker logs minio; exit 1
      - name: Pruebas (núcleo, aceptación CA-01…09/12…19, documentos, recepción, contrato, almacén S3)
        env:
          COROC_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: coroc-ci
          AWS_SECRET_ACCESS_KEY: coroc-ci-minio
        run: npm test

  # ─── Rendimiento (§21): 100.000 clientes y 2.000.000 de cuotas, latencias p95 con peticiones concurrentes ───
  perf:
    name: Rendimiento
    runs-on: ubuntu-latest
    needs: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      PERF: '1'
      PERF_REPORT: perf-report.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium para los PDF (Playwright)
        run: npx playwright-core install --with-deps chromium-headless-shell
      - run: npm run build -w @coroc/core
      - name: Carga de 100.000 clientes y mediciones
        working-directory: services/api
        run: npx vitest run test/perf.test.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: informe-de-rendimiento
          path: services/api/perf-report.json
          if-no-files-found: ignore

  # ─── Seguridad (§20): auditoría de dependencias y escaneo dinámico con OWASP ZAP sobre el contrato OpenAPI ───
  dast:
    name: Seguridad · dependencias y DAST
    runs-on: ubuntu-latest
    needs: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Auditoría de dependencias de producción (ninguna vulnerabilidad moderada o mayor)
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - name: Base, empresa de prueba y API en marcha
        working-directory: services/api
        env:
          DAST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          node scripts/dast.mjs prepare > dast.env
          set -a; . ./dast.env; set +a
          NO_COLOR=1 nohup node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/health && break; sleep 1; done
          node scripts/dast.mjs token | sed 's/^DAST_TOKEN=//' > token.txt
          echo "::add-mask::$(cat token.txt)"
          echo "DAST_TOKEN=$(cat token.txt)" >> "$GITHUB_ENV"
          # ZAP lee el contrato por HTTP, con la dirección local de la API y sin las operaciones que cerrarían su propia
          # sesión o la empresa (ZAP llama cada operación al importarlo, antes de aplicar sus exclusiones).
          node scripts/dast.mjs contract /tmp/contrato/openapi.yaml
          echo "Sesión antes del escaneo: $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $(cat token.txt)" http://localhost:3000/v1/me)"
          (cd /tmp/contrato && nohup python3 -m http.server 8088 > /dev/null 2>&1 &)
          sleep 1
          curl -sf http://localhost:8088/openapi.yaml > /dev/null
      - name: OWASP ZAP · escaneo de la API con sesión
        uses: zaproxy/action-api-scan@v0.10.0
        env:
          # Encabezado de sesión que ZAP agrega a cada petición a la API (mecanismo nativo de los scripts de ZAP).
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ env.DAST_TOKEN }}
          ZAP_AUTH_HEADER_SITE: localhost
        with:
          target: http://localhost:8088/openapi.yaml
          format: openapi
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
          artifact_name: informe-zap
          # -I: las advertencias no fallan el trabajo; fallan las reglas marcadas FAIL en .zap/rules.tsv (inyección, XSS,
          # SSRF…). Se excluyen las operaciones que cerrarían la sesión del propio escáner o la empresa.
          cmd_options: >-
            -I -O http://localhost:3000/v1
            -z "-config globalexcludeurl.url_list.url(0).regex=.*/v1/(auth/logout|me|me/password|me/mfa.*|me/sessions.*|users/.*|company/closure|restores.*)$
            -config globalexcludeurl.url_list.url(0).description=sesion
            -config globalexcludeurl.url_list.url(0).enabled=true
            -config scanner.maxScanDurationInMins=20
            -config scanner.maxRuleDurationInMins=3"
      - name: Cobertura del escaneo (estados HTTP de la API, con sesión)
        if: always()
        run: |
          echo "Sesión después del escaneo: $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $DAST_TOKEN" http://localhost:3000/v1/me)"
          grep -oE '(GET|POST|PUT|PATCH|DELETE) /v1/[^ ]* [0-9]{3}' services/api/api.log | awk '{print $NF}' | sort | uniq -c | sort -rn || true
          echo "Rutas con 2xx:"; grep -oE '(GET|POST|PUT|PATCH|DELETE) /v1/[^ ]* 2[0-9]{2}' services/api/api.log | sort | uniq -c | sort -rn | head -20 || true
          echo "Rutas con 401:"; grep -oE '(GET|POST|PUT|PATCH|DELETE) /v1/[^ ]* 401' services/api/api.log | sed -E 's#/[0-9a-f-]{36}#/{id}#g' | sort | uniq -c | sort -rn | head -10 || true
          ok=$(grep -cE ' /v1/[^ ]* 2[0-9]{2} ' services/api/api.log || true)
          echo "Respuestas 2xx con sesión: $ok"
          test "$ok" -gt 50
      - name: Errores 5xx de la API durante el escaneo (sin datos personales)
        if: always()
        run: grep -E ' 5[0-9]{2} ' services/api/api.log | head -50 || true

  docker:
    name: Imagen Docker de la API
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          tags: coroc-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── App Flutter: análisis y pruebas ───
  flutter:
    name: App · análisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/flutter-setup
      - name: Formato (dart format; los archivos generados no se versionan y quedan fuera)
        working-directory: apps/coroc_app
        run: dart format --output=none --set-exit-if-changed --line-length 200 $(git ls-files 'lib/*.dart' 'test/*.dart')
      - name: Análisis estático
        working-directory: apps/coroc_app
        run: flutter analyze --no-fatal-infos
      - name: Todos los archivos de lib/ cuentan en la cobertura
        working-directory: apps/coroc_app
        run: python3 tool/coverage_imports.py --check
      - name: Pruebas
        working-directory: apps/coroc_app
        run: flutter test --reporter expanded --coverage
      # El criterio de §21 es 75 %; el piso de la CI queda en 85 % para que lo ganado no se pierda sin notarlo.
      - name: Cobertura de la app ≥ 85 % (código generado excluido)
        working-directory: apps/coroc_app
        run: tool/coverage_report.sh 85 --files

  android:
    name: App · Android
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: ./.github/actions/flutter-setup
      - name: APK y App Bundle
        working-directory: apps/coroc_app
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - uses: actions/upload-artifact@v6
        with:
          name: coroc-android
          path: |
            apps/coroc_app/build/app/outputs/flutter-apk/app-release.apk
            apps/coroc_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  windows:
    name: App · Windows
    runs-on: windows-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/flutter-setup
      - name: Compilar
        working-directory: apps/coroc_app
        shell: bash
        run: flutter build windows --release
      - uses: actions/upload-artifact@v6
        with:
          name: coroc-windows
          path: apps/coroc_app/build/windows/x64/runner/Release/
          if-no-files-found: error

  # macOS e iOS consumen minutos de macOS: se compilan en main, en etiquetas de versión y a pedido.
  macos:
    name: App · macOS
    runs-on: macos-latest
    needs: flutter
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/flutter-setup
      - name: Compilar
        working-directory: apps/coroc_app
        run: flutter build macos --release
      - name: Empaquetar
        working-directory: apps/coroc_app/build/macos/Build/Products/Release
        run: ditto -c -k --keepParent *.app "$GITHUB_WORKSPACE/COROC-macos.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: coroc-macos
          path: COROC-macos.zip
          if-no-files-found: error

  ios:
    name: App · iOS (sin firma)
    runs-on: macos-latest
    needs: flutter
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/flutter-setup
      - name: Compilar
        working-directory: apps/coroc_app
        run: flutter build ios --release --no-codesign
      - name: Empaquetar
        working-directory: apps/coroc_app/build/ios/iphoneos
        run: ditto -c -k --keepParent Runner.app "$GITHUB_WORKSPACE/COROC-ios-sin-firma.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: coroc-ios-sin-firma
          path: COROC-ios-sin-firma.zip
          if-no-files-found: error
