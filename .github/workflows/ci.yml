name: CI

on:
  push:
    branches: [main, 'fase-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Núcleo financiero y API (Node.js 22, PostgreSQL 16) ───
  api:
    name: Núcleo y API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # En CI la lectura con OCR es obligatoria: sin Tesseract, las pruebas de CA-07 a CA-09 y CA-19 fallan en vez de omitirse.
      COROC_REQUIRE_OCR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium para los PDF (Playwright)
        run: npx playwright-core install --with-deps chromium-headless-shell
      - name: Tesseract y Poppler para la lectura de comprobantes (Fase 3)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-spa tesseract-ocr-por tesseract-ocr-eng poppler-utils
      - name: Compilar
        run: npm run build
      - name: Tipos (incluye pruebas)
        run: npm run typecheck -w @coroc/api && npm run typecheck -w @coroc/core
      - name: Textos de error en los tres idiomas
        run: npm run lint:i18n
      - name: Contrato OpenAPI
        run: npx --yes @redocly/cli@1 lint services/api/openapi.yaml --format=github-actions
      - name: Pruebas (núcleo, aceptación CA-01…09/12…19, documentos, recepción, contrato)
        run: npm test

  # ─── Rendimiento (§21): 100.000 clientes y 2.000.000 de cuotas, latencias p95 con peticiones concurrentes ───
  perf:
    name: Rendimiento
    runs-on: ubuntu-latest
    needs: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      PERF: '1'
      PERF_REPORT: perf-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium para los PDF (Playwright)
        run: npx playwright-core install --with-deps chromium-headless-shell
      - run: npm run build -w @coroc/core
      - name: Carga de 100.000 clientes y mediciones
        working-directory: services/api
        run: npx vitest run test/perf.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-de-rendimiento
          path: services/api/perf-report.json
          if-no-files-found: ignore

  docker:
    name: Imagen Docker de la API
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          tags: coroc-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── App Flutter: análisis y pruebas ───
  flutter:
    name: App · análisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter-setup
      - name: Formato
        working-directory: apps/coroc_app
        run: dart format --output=none --set-exit-if-changed --line-length 200 lib test || echo "::warning::Hay archivos sin formato (dart format)"
      - name: Análisis estático
        working-directory: apps/coroc_app
        run: flutter analyze --no-fatal-infos
      - name: Pruebas
        working-directory: apps/coroc_app
        run: flutter test --reporter expanded

  android:
    name: App · Android
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: ./.github/actions/flutter-setup
      - name: APK y App Bundle
        working-directory: apps/coroc_app
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: coroc-android
          path: |
            apps/coroc_app/build/app/outputs/flutter-apk/app-release.apk
            apps/coroc_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  windows:
    name: App · Windows
    runs-on: windows-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter-setup
      - name: Compilar
        working-directory: apps/coroc_app
        shell: bash
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: coroc-windows
          path: apps/coroc_app/build/windows/x64/runner/Release/
          if-no-files-found: error

  # macOS e iOS consumen minutos de macOS: se compilan en main, en etiquetas de versión y a pedido.
  macos:
    name: App · macOS
    runs-on: macos-latest
    needs: flutter
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter-setup
      - name: Compilar
        working-directory: apps/coroc_app
        run: flutter build macos --release
      - name: Empaquetar
        working-directory: apps/coroc_app/build/macos/Build/Products/Release
        run: ditto -c -k --keepParent *.app "$GITHUB_WORKSPACE/COROC-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: coroc-macos
          path: COROC-macos.zip
          if-no-files-found: error

  ios:
    name: App · iOS (sin firma)
    runs-on: macos-latest
    needs: flutter
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter-setup
      - name: Compilar
        working-directory: apps/coroc_app
        run: flutter build ios --release --no-codesign
      - name: Empaquetar
        working-directory: apps/coroc_app/build/ios/iphoneos
        run: ditto -c -k --keepParent Runner.app "$GITHUB_WORKSPACE/COROC-ios-sin-firma.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: coroc-ios-sin-firma
          path: COROC-ios-sin-firma.zip
          if-no-files-found: error
